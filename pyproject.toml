[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kindleify"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.3.2",
    "ebooklib>=0.20",
    "pypdf>=4.0.0",
    "pillow>=12.0.0",
    "requests",
    "trafilatura",
    "twine>=6.2.0",
]

[project.scripts]
kindleify = "kindleify.cli:cli"
